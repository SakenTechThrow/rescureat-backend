#spring.application.name=rescureat-backend
#server.port=8080
#
#
## Accept plain Postgres URLs like postgresql://... by prepending jdbc: automatically
## You can pass DATABASE_URL exactly as provided by Neon.
#spring.datasource.url=jdbc:${DATABASE_URL:postgresql://neondb_owner:npg_KrkRY3Qe1mVU@ep-soft-shape-ala9xmu5-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
## Optional overrides when URL does not already include credentials
#spring.datasource.username=${DB_USERNAME:}
#spring.datasource.password=${DB_PASSWORD:}
#spring.jpa.hibernate.ddl-auto=update
#
## JWT signing secret (use a long random string in production; can override with JWT_SECRET env var)
#jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
#jwt.expiration-ms=86400000
spring.application.name=rescureat-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}

# Local-development defaults. Override with env vars in deployed environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rescureat_db}
spring.datasource.username=${DB_USER:rescureat_dev}
spring.datasource.password=${DB_PASS:rescureat_dev}
spring.jpa.hibernate.ddl-auto=update

# Development-only fallback secret. Production profile requires JWT_SECRET explicitly.
jwt.secret=${JWT_SECRET:dev-only-change-me-0123456789abcdef0123456789abcdef0123456789abcdef}
jwt.expiration-ms=86400000

# Comma-separated origins, e.g. "https://app.example.com,https://www.example.com"
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://rescureat-frontend.vercel.app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
