spring.application.name=rescureat-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/rescureat_db
spring.datasource.username=rescureat_user
spring.datasource.password=rescureat_pass
spring.jpa.hibernate.ddl-auto=update

# JWT signing secret (use a long random string in production; can override with JWT_SECRET env var)
jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
jwt.expiration-ms=86400000